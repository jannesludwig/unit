<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNIT</title>
<script src="https://cdn.jsdelivr.net/npm/tone@15.1.22/build/Tone.js"></script>
<style>
  html,body{background:#000;color:#ddd;font:12px/1.4 ui-monospace,Menlo,monospace;margin:0}
  main{padding:24px} button,select{background:#000;color:#ddd;border:1px solid #444;font:inherit;padding:6px 12px}
</style>
</head>
<body>
<main>
  <div>UNIT — engine preview</div><br>
  <button id="play">PLAY / STOP [SPACE]</button>
  <select id="demo"></select>
  <pre id="pos"></pre>
</main>
<script type="module">
import { App } from './js/app.js';
import { DEMOS } from './js/seq/demos.js';
const app = new App();
const sel = document.getElementById('demo');
DEMOS.forEach((d, i) => sel.add(new Option(d.name, i)));
sel.onchange = () => app.loadDemo(+sel.value);
document.getElementById('play').onclick = () => app.togglePlay();
addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); app.togglePlay(); } });
app.on('step', (pos) => { document.getElementById('pos').textContent = pos.map((p) => String(p).padStart(3)).join(''); });
</script>
</body>
</html>
